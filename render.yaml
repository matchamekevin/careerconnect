services:
  # API Node/Express
  - type: web
    name: careerconnect-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    root: server

  # Application Vite (statique)
  - type: static_site
    name: careerconnect-frontend
    plan: free
    region: oregon
    buildCommand: |
      npm install
      npm run build
    publishDirectory: dist
